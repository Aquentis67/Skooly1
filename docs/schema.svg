<text x="30" y="725" fill="#555">SALLE et UTILISATEUR n’ont aucune relation avec les autres tables (planification et rôles hors périmètre de SkoolY 1).</text>
<text x="30" y="742" fill="#555">INTERVENANT_MATIERE : matières qu’un intervenant peut enseigner (RG03). INTERVENTION : intervenant + matière + promotion + volume (RG06).</text>
<text x="30" y="759" fill="#555">Clés étrangères : RESTRICT partout (RG09), sauf INTERVENANT_MATIERE (CASCADE : simple association).</text>
